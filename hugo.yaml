baseURL: "https://YOUR-GITHUB-USERNAME.github.io/glob/"
languageCode: "en-us"
title: "Glob"

# No RSS, no sitemap -- this site is intentionally not optimized for
# discovery. It's public because hiding is more trouble than it's worth,
# not because it's meant to be found.
disableKinds:
  - "sitemap"
  - "RSS"
  # Category browsing now lives in the interactive sidebar on /posts/
  # (see layouts/posts/list.html + static/js/browse.js), which reads
  # category/subcategory straight from post frontmatter. Hugo's separate
  # generated /categories/ pages are redundant with that, so they're off.
  - "taxonomy"
  - "term"

enableRobotsTXT: true

params:
  description: "A personal archive of things worth keeping."

markup:
  goldmark:
    renderer:
      # allow raw HTML (iframes, embed snippets) inside markdown content
      unsafe: true
      # Treat a single newline as a real line break. Without this, Markdown
      # collapses typed line breaks into one flowing paragraph -- so a list
      # typed one-per-line in the capture form came out as a flat run-on
      # sentence. Posts here are typed the way they're meant to read.
      hardWraps: true

pagination:
  pagerSize: 20
