baseURL: "https://YOUR-GITHUB-USERNAME.github.io/glob/"
languageCode: "en-us"
title: "Glob"
theme: ""

# No RSS, no sitemap -- this site is intentionally not optimized for
# discovery. It's public because hiding is more trouble than it's worth,
# not because it's meant to be found.
disableKinds:
  - "sitemap"
  - "RSS"

enableRobotsTXT: true

taxonomies:
  category: categories

params:
  description: "A personal archive of things worth keeping."

markup:
  goldmark:
    renderer:
      # allow raw HTML (iframes, embed snippets) inside markdown content
      unsafe: true

pagination:
  pagerSize: 20
