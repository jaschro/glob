<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Add to Glob</title>
<style>
:root{
  color-scheme: light dark;
  --fg:#1a1a1a; --bg:#ffffff; --muted:#6b6b6b; --accent:#35526b;
  --border:#e3e3e3; --ok:#1f8a4c; --bad:#c0392b; --card:#f7f7f7;
}
@media (prefers-color-scheme: dark) {
  :root{ --fg:#e8e8e8; --bg:#14161a; --muted:#9a9a9a; --accent:#8fb4d4; --border:#2b2e33; --card:#1c1e22; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
body{max-width:480px;margin:0 auto;padding:1.25rem 1rem 3rem;}
h1{font-size:1.25rem;margin:0 0 0.25rem;display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
h1 a{color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:400}
.gear{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);padding:0.25rem}
.field{margin-bottom:1rem}
label{display:block;font-size:0.82rem;color:var(--muted);margin-bottom:0.3rem}
input,select,textarea{
  width:100%;padding:0.6rem 0.7rem;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--fg);font-size:0.95rem;font-family:inherit;
}
textarea{min-height:6rem;resize:vertical}
textarea.tall{min-height:11rem}
input[type="file"]{padding:0.5rem 0.4rem;background:transparent;border:1px dashed var(--border)}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1rem}
.type-btn{
  padding:0.6rem 0.4rem;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--fg);font-size:0.82rem;text-align:center;cursor:pointer;
}
.type-btn.active{border-color:var(--accent);color:var(--accent);font-weight:600;background:rgba(53,82,107,0.08)}
.hidden{display:none !important}
button.submit{
  width:100%;padding:0.8rem;border:none;border-radius:8px;background:var(--accent);
  color:var(--bg);font-size:1rem;font-weight:600;cursor:pointer;margin-top:0.5rem;
}
button.submit:disabled{opacity:0.5}
.danger-zone{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
button.delete-btn{
  width:100%;padding:0.7rem;border:1px solid var(--bad);border-radius:8px;background:transparent;
  color:var(--bad);font-size:0.92rem;font-weight:600;cursor:pointer;
}
button.delete-btn:hover{background:rgba(192,57,43,0.08)}
button.delete-btn:disabled{opacity:0.5}
.status{margin-top:1rem;padding:0.75rem 1rem;border-radius:8px;font-size:0.88rem;display:none}
.status.ok{display:block;background:rgba(31,138,76,0.12);color:var(--ok)}
.status.bad{display:block;background:rgba(192,57,43,0.12);color:var(--bad)}
.status a{color:inherit;font-weight:600}
.screen{display:none}
.screen.on{display:block}
.settings-note{font-size:0.78rem;color:var(--muted);margin-top:0.5rem}
.back-link{color:var(--muted);text-decoration:none;font-size:0.85rem;display:inline-block;margin-bottom:1rem}
</style>
</head>
<body>

<div class="screen" id="screen-main">
  <h1><span id="form-heading">Add to Glob</span> <button class="gear" id="gear" title="Settings" type="button">&#9881;&#65039;</button></h1>
  <div><a href="../posts/">&larr; back to Glob</a></div>

  <form id="add-form">
    <div class="type-grid" id="type-grid">
      <div class="type-btn active" data-type="tweet">Tweet / X</div>
      <div class="type-btn" data-type="youtube">YouTube</div>
      <div class="type-btn" data-type="music">Music</div>
      <div class="type-btn" data-type="powerbi">PowerBI</div>
      <div class="type-btn" data-type="email">Email</div>
      <div class="type-btn" data-type="post">Post</div>
    </div>

    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" type="text" required placeholder="What is this?">
    </div>

    <div class="field">
      <label for="f-category">Category</label>
      <input id="f-category" type="text" list="category-list" required placeholder="e.g. Technology">
      <datalist id="category-list"></datalist>
    </div>

    <div class="field">
      <label for="f-subcategory">Subcategory (optional)</label>
      <input id="f-subcategory" type="text" list="subcategory-list" placeholder="e.g. AI">
      <datalist id="subcategory-list"></datalist>
    </div>

    <div class="field" id="url-field">
      <label for="f-url">Source URL</label>
      <input id="f-url" type="url" placeholder="https://…">
    </div>

    <div class="field" id="note-field">
      <label for="f-note">Leading text (optional)</label>
      <textarea id="f-note" placeholder="A note to show above the embed…"></textarea>
    </div>

    <div id="email-fields" class="hidden">
      <div class="field">
        <label for="f-email-from">From</label>
        <input id="f-email-from" type="text" placeholder="sender@example.com">
      </div>
      <div class="field">
        <label for="f-email-subject">Subject</label>
        <input id="f-email-subject" type="text" placeholder="Subject line">
      </div>
      <div class="field">
        <label for="f-email-body">Body</label>
        <textarea id="f-email-body" placeholder="Quoted email text…"></textarea>
      </div>
    </div>

    <div class="field hidden" id="post-body-field">
      <label for="f-post-body">Body</label>
      <textarea id="f-post-body" class="tall" placeholder="Write the post…"></textarea>
    </div>

    <div class="field" id="images-field">
      <label for="f-images">Images (optional)</label>
      <input id="f-images" type="file" accept="image/*" multiple>
    </div>

    <button type="submit" class="submit" id="submit-btn">Add to Glob</button>
    <div class="status" id="status"></div>

    <div class="danger-zone hidden" id="danger-zone">
      <button type="button" class="delete-btn" id="delete-btn">Delete this post</button>
    </div>
  </form>
</div>

<div class="screen" id="screen-settings">
  <h1>Settings</h1>
  <a href="#" class="back-link" id="settings-done">&larr; back to Add to Glob</a>

  <div class="field">
    <label for="cfg-user">GitHub username</label>
    <input id="cfg-user" type="text" autocapitalize="none" spellcheck="false" placeholder="jaschro">
  </div>
  <div class="field">
    <label for="cfg-repo">Repository</label>
    <input id="cfg-repo" type="text" autocapitalize="none" spellcheck="false" placeholder="glob">
  </div>
  <div class="field">
    <label for="cfg-token">Personal access token</label>
    <input id="cfg-token" type="password" autocapitalize="none" spellcheck="false" placeholder="github_pat_…">
  </div>
  <button type="button" class="submit" id="settings-save">Save</button>
  <p class="settings-note" id="settings-status" aria-live="polite"></p>
  <p class="settings-note">Stored only in this browser's local storage. Never sent anywhere except directly to api.github.com.</p>
</div>

<script>
(function () {
  "use strict";

  var cfg = { user: "", repo: "", token: "" };
  var currentType = "tweet";
  // Set once an ?edit= link loads an existing post: { path, sha, originalDate }
  var editState = null;
  // Holds an edit target requested before Settings had credentials saved.
  var pendingEditFile = null;

  var els = {
    gear: document.getElementById("gear"),
    screenMain: document.getElementById("screen-main"),
    screenSettings: document.getElementById("screen-settings"),
    settingsDone: document.getElementById("settings-done"),
    settingsSave: document.getElementById("settings-save"),
    settingsStatus: document.getElementById("settings-status"),
    cfgUser: document.getElementById("cfg-user"),
    cfgRepo: document.getElementById("cfg-repo"),
    cfgToken: document.getElementById("cfg-token"),
    typeGrid: document.getElementById("type-grid"),
    form: document.getElementById("add-form"),
    formHeading: document.getElementById("form-heading"),
    title: document.getElementById("f-title"),
    category: document.getElementById("f-category"),
    subcategory: document.getElementById("f-subcategory"),
    categoryList: document.getElementById("category-list"),
    subcategoryList: document.getElementById("subcategory-list"),
    urlField: document.getElementById("url-field"),
    url: document.getElementById("f-url"),
    noteField: document.getElementById("note-field"),
    note: document.getElementById("f-note"),
    emailFields: document.getElementById("email-fields"),
    emailFrom: document.getElementById("f-email-from"),
    emailSubject: document.getElementById("f-email-subject"),
    emailBody: document.getElementById("f-email-body"),
    postBodyField: document.getElementById("post-body-field"),
    postBody: document.getElementById("f-post-body"),
    images: document.getElementById("f-images"),
    submitBtn: document.getElementById("submit-btn"),
    deleteBtn: document.getElementById("delete-btn"),
    dangerZone: document.getElementById("danger-zone"),
    status: document.getElementById("status")
  };

  // Which fields are visible for each capture type.
  var FIELD_VISIBILITY = {
    tweet:   { url: true,  note: true,  email: false, postBody: false },
    youtube: { url: true,  note: true,  email: false, postBody: false },
    music:   { url: true,  note: true,  email: false, postBody: false },
    powerbi: { url: true,  note: true,  email: false, postBody: false },
    email:   { url: false, note: false, email: true,  postBody: false },
    post:    { url: false, note: false, email: false, postBody: true  }
  };

  function showScreen(name) {
    els.screenMain.classList.toggle("on", name === "main");
    els.screenSettings.classList.toggle("on", name === "settings");
  }

  function loadCfg() {
    try {
      Object.assign(cfg, JSON.parse(localStorage.getItem("glob-cfg") || "{}"));
    } catch (e) { /* ignore malformed storage */ }
    els.cfgUser.value = cfg.user || "";
    els.cfgRepo.value = cfg.repo || "";
    els.cfgToken.value = cfg.token || "";
    showScreen((!cfg.user || !cfg.repo || !cfg.token) ? "settings" : "main");
  }

  function saveCfg() {
    cfg.user = els.cfgUser.value.trim();
    cfg.repo = els.cfgRepo.value.trim();
    cfg.token = els.cfgToken.value.trim();
    localStorage.setItem("glob-cfg", JSON.stringify(cfg));
  }

  els.gear.addEventListener("click", function () {
    showScreen("settings");
  });
  els.settingsDone.addEventListener("click", function (e) {
    e.preventDefault();
    showScreen("main");
  });
  els.settingsSave.addEventListener("click", function () {
    saveCfg();
    if (els.settingsStatus) els.settingsStatus.textContent = "Saved.";
    if (pendingEditFile) {
      var f = pendingEditFile;
      pendingEditFile = null;
      loadPostForEdit(f);
    } else {
      showScreen("main");
    }
  });
  [els.cfgUser, els.cfgRepo, els.cfgToken].forEach(function (el) {
    el.addEventListener("input", saveCfg);
  });

  function applyTypeVisibility() {
    var v = FIELD_VISIBILITY[currentType] || FIELD_VISIBILITY.tweet;
    els.urlField.classList.toggle("hidden", !v.url);
    els.noteField.classList.toggle("hidden", !v.note);
    els.emailFields.classList.toggle("hidden", !v.email);
    els.postBodyField.classList.toggle("hidden", !v.postBody);
  }

  els.typeGrid.addEventListener("click", function (e) {
    var btn = e.target.closest(".type-btn");
    if (!btn) return;
    currentType = btn.getAttribute("data-type");
    Array.prototype.forEach.call(els.typeGrid.children, function (c) {
      c.classList.toggle("active", c === btn);
    });
    applyTypeVisibility();
  });

  // Populate category/subcategory suggestions from the live post index.
  // Failure here is non-fatal -- the form still works, just without autocomplete.
  function loadSuggestions() {
    fetch("../posts/index.json")
      .then(function (res) { return res.ok ? res.json() : []; })
      .then(function (posts) {
        var cats = new Set();
        var subcats = new Set();
        (posts || []).forEach(function (p) {
          (p.categories || []).forEach(function (c) { cats.add(c); });
          if (p.subcategory) subcats.add(p.subcategory);
        });
        fillDatalist(els.categoryList, cats);
        fillDatalist(els.subcategoryList, subcats);
      })
      .catch(function () { /* offline or first-ever post -- fine, just no suggestions */ });
  }

  function fillDatalist(el, values) {
    el.innerHTML = "";
    Array.from(values).sort().forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v;
      el.appendChild(opt);
    });
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function slugify(s) {
    var slug = s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return slug || "untitled";
  }

  // UTF-8 safe base64 encoding (handles emoji, accents, etc. in titles/notes)
  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  // UTF-8 safe base64 decoding -- the inverse of utf8ToBase64, used when
  // loading an existing post's content back from GitHub for editing.
  function base64ToUtf8(b64) {
    var clean = String(b64 || "").replace(/\s/g, "");
    return decodeURIComponent(escape(atob(clean)));
  }

  // Parses the small, self-authored frontmatter format buildFrontmatter()
  // writes (not general YAML) back into { fields, body }.
  function parseFrontmatter(raw) {
    var fields = {};
    var body = raw;
    if (raw.slice(0, 3) === "---") {
      var end = raw.indexOf("\n---", 3);
      if (end !== -1) {
        var fm = raw.slice(3, end).trim();
        body = raw.slice(end + 4).replace(/^\n+/, "");
        fm.split("\n").forEach(function (line) {
          var idx = line.indexOf(":");
          if (idx === -1) return;
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          if (val.charAt(0) === "[" || val.charAt(0) === '"') {
            try { fields[key] = JSON.parse(val); } catch (e) { fields[key] = val; }
          } else {
            fields[key] = val;
          }
        });
      }
    }
    return { fields: fields, body: body.replace(/\n+$/, "") };
  }

  function buildFrontmatter(fields) {
    var fm = "---\n";
    fm += "title: " + JSON.stringify(fields.title) + "\n";
    fm += "date: " + fields.date + "\n";
    fm += "type: " + fields.type + "\n";
    fm += "categories: [" + JSON.stringify(fields.category) + "]\n";
    if (fields.subcategory) fm += "subcategory: " + JSON.stringify(fields.subcategory) + "\n";

    var body = "";
    if (fields.type === "email") {
      if (fields.emailFrom) fm += "email_from: " + JSON.stringify(fields.emailFrom) + "\n";
      if (fields.emailSubject) fm += "email_subject: " + JSON.stringify(fields.emailSubject) + "\n";
      fm += "---\n\n";
      body = fields.emailBody || "";
    } else if (fields.type === "post") {
      fm += "---\n\n";
      body = fields.postBody || "";
    } else {
      fm += "source_url: " + JSON.stringify(fields.url || "") + "\n";
      fm += "---\n\n";
      body = fields.note || "";
    }

    if (fields.images && fields.images.length) {
      var imgMd = fields.images.map(function (src) { return "![](" + src + ")"; }).join("\n\n");
      body = body ? (body + "\n\n" + imgMd) : imgMd;
    }

    return fm + body + "\n";
  }

  function setStatus(kind, html) {
    els.status.className = "status " + kind;
    els.status.innerHTML = html;
  }

  // Low-level "create/update file in the repo" call, shared by the post
  // itself and any images that need to go up first. Pass `sha` (the file's
  // current sha from GitHub) to update an existing file instead of creating
  // a new one.
  function githubPut(filePath, base64Content, message, sha) {
    var apiUrl = "https://api.github.com/repos/" + cfg.user + "/" + cfg.repo + "/contents/" + filePath;
    var payload = { message: message, content: base64Content, branch: "main" };
    if (sha) payload.sha = sha;
    return fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + cfg.token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (res.ok) return res.json();
      return res.json()
        .catch(function () { return {}; })
        .then(function (err) {
          throw new Error((err && err.message) || ("GitHub responded " + res.status));
        });
    });
  }

  // Fetches an existing file's content + sha, for the Edit flow.
  function githubGet(filePath) {
    var apiUrl = "https://api.github.com/repos/" + cfg.user + "/" + cfg.repo + "/contents/" + filePath;
    return fetch(apiUrl, {
      headers: {
        "Authorization": "Bearer " + cfg.token,
        "Accept": "application/vnd.github+json"
      }
    }).then(function (res) {
      if (res.ok) return res.json();
      return res.json()
        .catch(function () { return {}; })
        .then(function (err) {
          throw new Error((err && err.message) || ("GitHub responded " + res.status));
        });
    });
  }

  // Deletes an existing file -- GitHub's Contents API requires the sha
  // of the version being removed, same as an update.
  function githubDelete(filePath, sha, message) {
    var apiUrl = "https://api.github.com/repos/" + cfg.user + "/" + cfg.repo + "/contents/" + filePath;
    return fetch(apiUrl, {
      method: "DELETE",
      headers: {
        "Authorization": "Bearer " + cfg.token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: message, sha: sha, branch: "main" })
    }).then(function (res) {
      if (res.ok) return res.json().catch(function () { return {}; });
      return res.json()
        .catch(function () { return {}; })
        .then(function (err) {
          throw new Error((err && err.message) || ("GitHub responded " + res.status));
        });
    });
  }

  // Reads a list of File objects into { file, base64 } pairs via FileReader.
  function readImagesAsBase64(files) {
    return Promise.all(files.map(function (file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result || "");
          var comma = result.indexOf(",");
          resolve({ file: file, base64: comma === -1 ? "" : result.slice(comma + 1) });
        };
        reader.onerror = function () {
          reject(new Error("Couldn't read image: " + file.name));
        };
        reader.readAsDataURL(file);
      });
    }));
  }

  // Uploads each image in turn (GitHub's Contents API is one file per call)
  // and returns the site-relative paths to reference from the post body.
  function uploadImages(encoded, dateStr, slug) {
    var paths = [];
    var chain = Promise.resolve();
    encoded.forEach(function (item, i) {
      chain = chain.then(function () {
        var ext = (item.file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
        var name = dateStr + "-" + slug + "-img" + (i + 1) + "." + ext;
        return githubPut("static/images/" + name, item.base64, "Add image for: " + slug).then(function () {
          paths.push("/glob/images/" + name);
        });
      });
    });
    return chain.then(function () { return paths; });
  }

  // Populates the form from a parsed existing post, matching whatever
  // type/fields it was saved with.
  function fillFormFromParsed(parsed) {
    var f = parsed.fields;
    var type = FIELD_VISIBILITY[f.type] ? f.type : "tweet";
    currentType = type;
    Array.prototype.forEach.call(els.typeGrid.children, function (c) {
      c.classList.toggle("active", c.getAttribute("data-type") === type);
    });
    applyTypeVisibility();

    els.title.value = f.title || "";
    els.category.value = (f.categories && f.categories[0]) || "";
    els.subcategory.value = f.subcategory || "";
    els.url.value = f.source_url || "";
    els.emailFrom.value = f.email_from || "";
    els.emailSubject.value = f.email_subject || "";

    if (type === "email") {
      els.emailBody.value = parsed.body || "";
    } else if (type === "post") {
      els.postBody.value = parsed.body || "";
    } else {
      els.note.value = parsed.body || "";
    }
  }

  // Called when the page is opened with ?edit=<filename> from a post page's
  // Edit link. Needs credentials first -- if they're missing, remembers the
  // request and resumes once Settings is saved.
  function enterEditMode(filename) {
    if (!cfg.user || !cfg.repo || !cfg.token) {
      pendingEditFile = filename;
      showScreen("settings");
      if (els.settingsStatus) els.settingsStatus.textContent = "Add your GitHub details, then Save to continue editing.";
      return;
    }
    loadPostForEdit(filename);
  }

  function loadPostForEdit(filename) {
    var path = "content/posts/" + filename;
    setStatus("", "");
    els.submitBtn.disabled = true;
    els.submitBtn.textContent = "Loading…";

    githubGet(path)
      .then(function (data) {
        var raw = base64ToUtf8(data.content || "");
        var parsed = parseFrontmatter(raw);
        editState = { path: path, sha: data.sha, originalDate: parsed.fields.date || "" };
        fillFormFromParsed(parsed);
        if (els.formHeading) els.formHeading.textContent = "Edit post";
        els.submitBtn.textContent = "Save changes";
        els.dangerZone.classList.remove("hidden");
        showScreen("main");
      })
      .catch(function (err) {
        showScreen("main");
        setStatus("bad", "Couldn't load that post: " + escapeHtml(err.message));
      })
      .finally(function () {
        els.submitBtn.disabled = false;
        if (els.submitBtn.textContent === "Loading…") els.submitBtn.textContent = "Add to Glob";
      });
  }

  els.deleteBtn.addEventListener("click", function () {
    if (!editState) return;
    if (!window.confirm("Delete this post? This can't be undone.")) return;

    els.deleteBtn.disabled = true;
    els.deleteBtn.textContent = "Deleting…";
    githubDelete(editState.path, editState.sha, "Delete post: " + (els.title.value.trim() || editState.path))
      .then(function () {
        setStatus("ok", "Deleted. It'll disappear from the site in a minute or two.");
        els.submitBtn.disabled = true;
        els.dangerZone.classList.add("hidden");
      })
      .catch(function (err) {
        setStatus("bad", "Couldn't delete: " + escapeHtml(err.message));
      })
      .finally(function () {
        els.deleteBtn.disabled = false;
        els.deleteBtn.textContent = "Delete this post";
      });
  });

  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    saveCfg();

    if (!cfg.user || !cfg.repo || !cfg.token) {
      showScreen("settings");
      setStatus("bad", "Fill in your GitHub username, repo, and token in Settings first.");
      return;
    }
    var title = els.title.value.trim();
    var category = els.category.value.trim();
    if (!title || !category) {
      setStatus("bad", "Title and category are required.");
      return;
    }
    if (currentType === "post" && !els.postBody.value.trim()) {
      setStatus("bad", "Body is required for a Post.");
      return;
    }

    var today = new Date();
    var todayStr = today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());
    var dateStr = (editState && editState.originalDate) ? editState.originalDate : todayStr;
    var slug = slugify(title);
    var imageFiles = Array.prototype.slice.call((els.images && els.images.files) || []);
    var savingLabel = editState ? "Saving…" : "Adding…";

    els.submitBtn.disabled = true;
    els.submitBtn.textContent = imageFiles.length ? "Uploading images…" : savingLabel;
    setStatus("", "");

    readImagesAsBase64(imageFiles)
      .then(function (encoded) {
        return uploadImages(encoded, dateStr, slug);
      })
      .then(function (imagePaths) {
        els.submitBtn.textContent = savingLabel;
        var content = buildFrontmatter({
          title: title,
          date: dateStr,
          type: currentType,
          category: category,
          subcategory: els.subcategory.value.trim(),
          url: els.url.value.trim(),
          note: els.note.value.trim(),
          postBody: els.postBody.value,
          emailFrom: els.emailFrom.value.trim(),
          emailSubject: els.emailSubject.value.trim(),
          emailBody: els.emailBody.value,
          images: imagePaths
        });
        if (editState) {
          return githubPut(editState.path, utf8ToBase64(content), "Update post: " + title, editState.sha);
        }
        var filePath = "content/posts/" + dateStr + "-" + slug + ".md";
        return githubPut(filePath, utf8ToBase64(content), "Add post: " + title);
      })
      .then(function (result) {
        if (editState) {
          if (result && result.content && result.content.sha) editState.sha = result.content.sha;
          var slugPart = editState.path.replace(/^content\/posts\//, "").replace(/\.md$/, "");
          setStatus("ok", 'Saved. <a href="../posts/' + slugPart + '/">View post</a>');
        } else {
          setStatus("ok", "Added! It'll appear on the site in a minute or two once the build finishes.");
          els.form.reset();
          currentType = "tweet";
          Array.prototype.forEach.call(els.typeGrid.children, function (c) {
            c.classList.toggle("active", c.getAttribute("data-type") === "tweet");
          });
          applyTypeVisibility();
          els.title.focus();
        }
        loadSuggestions();
      })
      .catch(function (err) {
        setStatus("bad", "Couldn't save: " + escapeHtml(err.message));
      })
      .finally(function () {
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = editState ? "Save changes" : "Add to Glob";
      });
  });

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  loadCfg();
  loadSuggestions();
  applyTypeVisibility();

  var editParam = new URLSearchParams(window.location.search).get("edit");
  if (editParam) enterEditMode(editParam);
})();
</script>
</body>
</html>
