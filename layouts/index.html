{{ define "main" }}
<header class="list-header">
  <h1>{{ .Site.Title }}</h1>
  <p class="section-intro">{{ .Site.Params.description }}</p>
</header>

<h2>Recent</h2>
<ul class="post-stream">
  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ range first 10 $posts.ByDate.Reverse }}
    {{ partial "post-row.html" . }}
  {{ end }}
</ul>

<p><a href="{{ "posts/" | relURL }}">All posts →</a></p>
{{ end }}
