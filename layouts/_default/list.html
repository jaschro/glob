{{ define "main" }}
<header class="list-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="section-intro">{{ . }}</div>{{ end }}
</header>

{{ if .Pages }}
<ul class="page-list">
  {{ range .Pages.ByTitle }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ else }}
<p class="empty-note">Nothing here yet.</p>
{{ end }}
{{ end }}
